<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moph Echo Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { darkMode:'class', theme:{ extend:{ fontFamily:{ sans:['Inter','system-ui','sans-serif'] }, colors:{ void:{900:'#06060a',800:'#0a0a12',700:'#10101c',600:'#161624'}, amethyst:{400:'#a78bfa',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9'}, gold:{400:'#facc15',500:'#eab308'} } } } }
</script>
<style>
body { background:#06060a; }
.glass { background:rgba(16,16,28,0.75); backdrop-filter:blur(24px); }
.spinner { border:2px solid rgba(139,92,246,.2); border-top-color:#a78bfa; border-radius:50%; width:16px; height:16px; animation:spin .8s linear infinite; display:inline-block; }
@keyframes spin { to{transform:rotate(360deg);} }
</style>
</head>
<body class="font-sans text-gray-200 min-h-screen">

<div id="lockScreen" class="min-h-screen flex items-center justify-center p-4">
  <div class="glass rounded-3xl p-8 max-w-md w-full border border-amethyst-500/20 shadow-2xl">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-amethyst-600 to-amethyst-700 mb-3">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      </div>
      <h1 class="text-xl font-semibold">Admin Panel</h1>
      <p class="text-xs text-gray-500 mt-1">Enter your admin key to continue</p>
    </div>
    <input type="password" id="adminKeyInput" placeholder="Admin key" autocomplete="off" class="w-full bg-void-900 border border-void-600 rounded-xl px-4 py-3 text-sm focus:border-amethyst-500 focus:outline-none transition mb-3">
    <button onclick="unlock()" class="w-full py-3 rounded-xl bg-gradient-to-r from-amethyst-600 to-amethyst-700 text-white font-medium text-sm">Unlock</button>
    <p id="lockError" class="hidden text-xs text-red-400 text-center mt-3"></p>
  </div>
</div>

<div id="adminApp" class="hidden max-w-2xl mx-auto p-4">
  <header class="glass rounded-2xl p-4 border border-void-600 mb-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-amethyst-600 to-amethyst-700 flex items-center justify-center">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      </div>
      <div>
        <h1 class="text-sm font-semibold">Moph Echo Admin</h1>
        <p class="text-[10px] text-gray-500" id="modeLabel">Create mode</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="newTeaching()" id="newBtn" class="hidden text-xs text-amethyst-400 hover:text-amethyst-300 transition">+ New</button>
      <a href="/" class="text-xs text-gray-500 hover:text-amethyst-400 transition">View App</a>
      <button onclick="lock()" class="text-xs text-gray-500 hover:text-red-400 transition">Lock</button>
    </div>
  </header>

  <div class="glass rounded-2xl p-5 border border-void-600 space-y-4">
    <input type="hidden" id="editId" value="">

    <div>
      <label class="text-xs text-gray-500 uppercase tracking-wider">Title (optional)</label>
      <input type="text" id="tTitle" placeholder="e.g., On Stillness" class="w-full mt-1 bg-void-900 border border-void-600 rounded-xl px-4 py-3 text-sm focus:border-amethyst-500 focus:outline-none transition">
    </div>

    <div>
      <label class="text-xs text-gray-500 uppercase tracking-wider">Cover Image (optional)</label>
      <div id="coverDrop" class="mt-1 border-2 border-dashed border-void-600 rounded-xl p-6 text-center cursor-pointer hover:border-amethyst-500/50 transition">
        <input type="file" id="coverInput" accept="image/*" class="hidden">
        <p id="coverLabel" class="text-xs text-gray-500">Tap to upload cover image (max 3MB)</p>
        <img id="coverPreview" class="hidden max-h-48 mx-auto rounded-lg mt-2">
      </div>
      <button onclick="clearCover()" id="clearCoverBtn" class="hidden mt-2 text-[10px] text-red-400 hover:text-red-300">Remove cover</button>
    </div>

    <div>
      <label class="text-xs text-gray-500 uppercase tracking-wider">Video (optional)</label>
      <div id="videoDrop" class="mt-1 border-2 border-dashed border-void-600 rounded-xl p-6 text-center cursor-pointer hover:border-amethyst-500/50 transition">
        <input type="file" id="videoInput" accept="video/*" class="hidden">
        <p id="videoLabel" class="text-xs text-gray-500">Tap to upload video (max 3MB) or paste a link below</p>
        <video id="videoPreview" class="hidden max-h-48 mx-auto rounded-lg mt-2" controls></video>
      </div>
      <input type="text" id="videoUrlInput" placeholder="Or paste YouTube / Vimeo / MP4 link" class="w-full mt-2 bg-void-900 border border-void-600 rounded-xl px-4 py-2 text-xs focus:border-amethyst-500 focus:outline-none transition">
      <button onclick="clearVideo()" id="clearVideoBtn" class="hidden mt-2 text-[10px] text-red-400 hover:text-red-300">Remove video</button>
    </div>

    <div>
      <label class="text-xs text-gray-500 uppercase tracking-wider">Tags (comma separated)</label>
      <input type="text" id="tTags" placeholder="e.g., Gnosis, Discipline, Wounds" class="w-full mt-1 bg-void-900 border border-void-600 rounded-xl px-4 py-3 text-sm focus:border-amethyst-500 focus:outline-none transition">
    </div>

    <div>
      <label class="text-xs text-gray-500 uppercase tracking-wider">Content</label>
      <textarea id="tContent" rows="14" placeholder="Write your teaching here...&#10;&#10;Use ✦ for insight markers and ❓ for the closing question.&#10;Use **word** for bold." class="w-full mt-1 bg-void-900 border border-void-600 rounded-xl px-4 py-3 text-sm focus:border-amethyst-500 focus:outline-none transition resize-y font-mono"></textarea>
    </div>

    <label class="flex items-center gap-2 cursor-pointer select-none">
      <input type="checkbox" id="pinChk" class="w-4 h-4 rounded border-void-600 bg-void-900 accent-amethyst-600">
      <span class="text-xs text-gray-400">📌 Pin this teaching to top of feed</span>
    </label>

    <label class="flex items-center gap-2 cursor-pointer select-none">
      <input type="checkbox" id="featuredChk" class="w-4 h-4 rounded border-void-600 bg-void-900 accent-amethyst-600">
      <span class="text-xs text-gray-400">⭐ Feature as today's teaching</span>
    </label>

    <label class="flex items-center gap-2 cursor-pointer select-none" id="emailChkWrap">
      <input type="checkbox" id="sendEmailChk" class="w-4 h-4 rounded border-void-600 bg-void-900 accent-amethyst-600" checked>
      <span class="text-xs text-gray-400">Send email to all users after publishing</span>
    </label>

    <button onclick="publish()" id="publishBtn" class="w-full py-3 rounded-xl bg-gradient-to-r from-amethyst-600 to-amethyst-700 text-white font-medium text-sm flex items-center justify-center gap-2">
      <span id="publishText">Publish Teaching</span>
    </button>
    <p id="pubStatus" class="hidden text-xs text-center"></p>
  </div>

  <div class="glass rounded-2xl p-5 border border-void-600 mt-4">
    <div class="flex items-center justify-between mb-3">
      <h3 class="text-sm font-semibold">All Teachings</h3>
      <button onclick="loadRecent()" class="text-[10px] text-amethyst-400 hover:text-amethyst-300">Refresh</button>
    </div>
    <div id="recentTeachings" class="space-y-2 text-xs text-gray-500">Loading...</div>
  </div>
</div>

<div id="deleteModal" class="hidden fixed inset-0 z-[80] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="glass rounded-2xl p-6 max-w-sm w-full border border-red-500/30 shadow-2xl">
    <h3 class="text-base font-semibold mb-2">Delete this teaching?</h3>
    <p class="text-xs text-gray-400 mb-5">This cannot be undone. All comments and reactions will also be removed.</p>
    <div class="flex gap-2">
      <button onclick="closeDeleteModal()" class="flex-1 py-2.5 rounded-xl bg-void-800 text-gray-300 text-sm font-medium">Cancel</button>
      <button onclick="confirmDelete()" id="confirmDelBtn" class="flex-1 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-sm font-medium">Delete</button>
    </div>
  </div>
</div>

<script>
let adminKey = sessionStorage.getItem('moph_admin_key') || '';
let coverImageUrl = null;
let videoFileBase64 = null;
let videoUrlExternal = null;
let existingCoverUrl = null;
let existingVideoUrl = null;
let pendingDeleteId = null;

// ===== COVER =====
document.getElementById('coverDrop').addEventListener('click', () => document.getElementById('coverInput').click());
document.getElementById('coverInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 3 * 1024 * 1024) { alert('Image too large. Max 3MB.'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    coverImageUrl = reader.result;
    document.getElementById('coverPreview').src = coverImageUrl;
    document.getElementById('coverPreview').classList.remove('hidden');
    document.getElementById('coverLabel').textContent = '✓ New cover selected';
    document.getElementById('clearCoverBtn').classList.remove('hidden');
  };
  reader.readAsDataURL(file);
});

function clearCover() {
  coverImageUrl = null;
  existingCoverUrl = null;
  document.getElementById('coverPreview').classList.add('hidden');
  document.getElementById('coverPreview').src = '';
  document.getElementById('coverLabel').textContent = 'Tap to upload cover image (max 3MB)';
  document.getElementById('coverInput').value = '';
  document.getElementById('clearCoverBtn').classList.add('hidden');
}

// ===== VIDEO =====
document.getElementById('videoDrop').addEventListener('click', (e) => {
  if (e.target.id !== 'videoPreview') document.getElementById('videoInput').click();
});
document.getElementById('videoInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 3 * 1024 * 1024) {
    alert('Video too large. Max 3MB. Compress or use a link.');
    document.getElementById('videoInput').value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    videoFileBase64 = reader.result;
    const preview = document.getElementById('videoPreview');
    preview.src = videoFileBase64;
    preview.classList.remove('hidden');
    document.getElementById('videoLabel').textContent = '✓ New video selected';
    document.getElementById('clearVideoBtn').classList.remove('hidden');
    document.getElementById('videoUrlInput').value = '';
    videoUrlExternal = null;
  };
  reader.readAsDataURL(file);
});
document.getElementById('videoUrlInput').addEventListener('input', (e) => {
  const url = e.target.value.trim();
  if (url) {
    videoUrlExternal = url;
    videoFileBase64 = null;
    document.getElementById('videoPreview').classList.add('hidden');
    document.getElementById('videoLabel').textContent = '✓ Video link pasted';
    document.getElementById('clearVideoBtn').classList.remove('hidden');
  }
});
function clearVideo() {
  videoFileBase64 = null;
  videoUrlExternal = null;
  existingVideoUrl = null;
  document.getElementById('videoPreview').classList.add('hidden');
  document.getElementById('videoPreview').src = '';
  document.getElementById('videoInput').value = '';
  document.getElementById('videoUrlInput').value = '';
  document.getElementById('videoLabel').textContent = 'Tap to upload video (max 3MB) or paste a link below';
  document.getElementById('clearVideoBtn').classList.add('hidden');
}

// ===== AUTH =====
function unlock() {
  const key = document.getElementById('adminKeyInput').value.trim();
  if (!key) { showLockError('Enter the key'); return; }
  adminKey = key;
  sessionStorage.setItem('moph_admin_key', key);
  showAdmin();
}
function lock() {
  sessionStorage.removeItem('moph_admin_key');
  adminKey = '';
  document.getElementById('adminApp').classList.add('hidden');
  document.getElementById('lockScreen').classList.remove('hidden');
  document.getElementById('adminKeyInput').value = '';
}
function showLockError(m) { const e = document.getElementById('lockError'); e.textContent = m; e.classList.remove('hidden'); }
function showAdmin() {
  document.getElementById('lockScreen').classList.add('hidden');
  document.getElementById('adminApp').classList.remove('hidden');
  loadRecent();
}

function newTeaching() {
  document.getElementById('editId').value = '';
  document.getElementById('tTitle').value = '';
  document.getElementById('tContent').value = '';
  document.getElementById('tTags').value = '';
  document.getElementById('pinChk').checked = false;
  document.getElementById('featuredChk').checked = false;
  document.getElementById('sendEmailChk').checked = true;
  document.getElementById('emailChkWrap').classList.remove('hidden');
  clearCover();
  clearVideo();
  document.getElementById('publishText').textContent = 'Publish Teaching';
  document.getElementById('modeLabel').textContent = 'Create mode';
  document.getElementById('newBtn').classList.add('hidden');
  document.getElementById('pubStatus').classList.add('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== PUBLISH / UPDATE =====
async function publish() {
  const editId = document.getElementById('editId').value;
  const isEdit = !!editId;
  const title = document.getElementById('tTitle').value.trim();
  const content = document.getElementById('tContent').value.trim();
  const tagsInput = document.getElementById('tTags').value.trim();
  const tags = tagsInput ? tagsInput.split(',').map(t => t.trim().toLowerCase()).filter(Boolean) : [];
  const pinned = document.getElementById('pinChk').checked;
  const featured = document.getElementById('featuredChk').checked;
  const sendEmail = document.getElementById('sendEmailChk').checked;

  if (!content) { showStatus('Content is required.', 'error'); return; }

  const btn = document.getElementById('publishBtn');
  const txt = document.getElementById('publishText');
  btn.disabled = true;
  txt.innerHTML = '<span class="spinner"></span> ' + (isEdit ? 'Updating...' : 'Publishing...');
  showStatus(isEdit ? 'Updating...' : 'Sending...', 'info');

  try {
    const payload = {
      adminKey,
      action: isEdit ? 'update' : 'create',
      title,
      content,
      tags,
      pinned,
      featured
    };
    if (isEdit) payload.id = editId;

    // Cover logic
    if (coverImageUrl) payload.cover_image = coverImageUrl;
    else if (isEdit && !existingCoverUrl) payload.cover_image = null;

    // Video logic
    if (videoFileBase64) payload.video_file = videoFileBase64;
    else if (videoUrlExternal) payload.video_url = videoUrlExternal;
    else if (isEdit && !existingVideoUrl) payload.video_url = null;

    if (!isEdit) payload.sendEmail = sendEmail;

    const res = await fetch('/api/publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (!res.ok) {
      showStatus('Error: ' + (data.error || 'Unknown'), 'error');
      btn.disabled = false;
      txt.textContent = isEdit ? 'Update Teaching' : 'Publish Teaching';
      return;
    }

    let msg = isEdit ? '✓ Updated' : '✓ Published';
    if (featured) msg += ' · ⭐ Featured today';
    if (!isEdit && data.emailResult?.sent) msg += ' · Emails sent';
    else if (!isEdit && data.emailResult?.error) msg += ' · Email failed: ' + data.emailResult.error;
    showStatus(msg, 'success');

    if (isEdit) setTimeout(newTeaching, 1200);
    else {
      document.getElementById('tTitle').value = '';
      document.getElementById('tContent').value = '';
      document.getElementById('tTags').value = '';
      document.getElementById('pinChk').checked = false;
      document.getElementById('featuredChk').checked = false;
      clearCover();
      clearVideo();
    }

    loadRecent();
  } catch (e) {
    showStatus('Network error: ' + e.message, 'error');
  }

  btn.disabled = false;
  txt.textContent = isEdit ? 'Update Teaching' : 'Publish Teaching';
}

function showStatus(msg, type) {
  const el = document.getElementById('pubStatus');
  el.textContent = msg;
  el.className = 'text-xs text-center ' + (type === 'success' ? 'text-green-400' : type === 'error' ? 'text-red-400' : 'text-gray-400');
  el.classList.remove('hidden');
}

// ===== LOAD LIST =====
async function loadRecent() {
  const el = document.getElementById('recentTeachings');
  el.innerHTML = '<div class="text-center py-4"><span class="spinner"></span></div>';
  try {
    const res = await fetch('/api/config');
    const cfg = await res.json();
    const r = await fetch(`${cfg.supabaseUrl}/rest/v1/teachings?select=*&order=pinned.desc,created_at.desc&limit=100`, {
      headers: { 'apikey': cfg.supabaseAnonKey, 'Authorization': `Bearer ${cfg.supabaseAnonKey}` }
    });
    const data = await r.json();
    if (!data || data.length === 0) { el.innerHTML = '<p class="text-xs text-gray-600">No teachings yet.</p>'; return; }
    const today = new Date().toISOString().split('T')[0];
    el.innerHTML = data.map(t => {
      const isFeatured = t.featured_date === today;
      return `
      <div class="bg-void-800/50 rounded-xl p-3 border border-void-600">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2 flex-wrap">
              <p class="text-xs text-gray-300 font-medium truncate">${escapeHtml(t.title || 'Untitled')}</p>
              ${t.pinned ? '<span class="text-[9px] px-1.5 py-0.5 rounded-full bg-gold-400/20 text-gold-300">📌</span>' : ''}
              ${isFeatured ? '<span class="text-[9px] px-1.5 py-0.5 rounded-full bg-amethyst-600/30 text-amethyst-300">⭐ Featured</span>' : ''}
              ${t.video_url ? '<span class="text-[9px] px-1.5 py-0.5 rounded-full bg-amethyst-600/30 text-amethyst-300">🎬 Video</span>' : ''}
              ${t.cover_image ? '<span class="text-[9px] px-1.5 py-0.5 rounded-full bg-amethyst-600/30 text-amethyst-300">🖼 Image</span>' : ''}
            </div>
            ${(t.tags && t.tags.length > 0) ? `<div class="flex flex-wrap gap-1 mt-1">${t.tags.map(tag => `<span class="text-[9px] px-1.5 py-0.5 rounded-full bg-void-700 text-gray-500">#${escapeHtml(tag)}</span>`).join('')}</div>` : ''}
            <p class="text-[10px] text-gray-600 mt-1">${new Date(t.created_at).toLocaleString()}</p>
          </div>
          <div class="flex items-center gap-1 flex-shrink-0">
            <button onclick='editTeaching(${JSON.stringify(t).replace(/'/g, "&#39;")})' class="p-1.5 text-gray-500 hover:text-amethyst-400 transition" title="Edit">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            </button>
            <button onclick="askDelete(${t.id})" class="p-1.5 text-gray-500 hover:text-red-400 transition" title="Delete">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
          </div>
        </div>
      </div>
    `;
    }).join('');
  } catch (e) { el.innerHTML = '<p class="text-xs text-red-400">Failed to load.</p>'; }
}

function editTeaching(t) {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('editId').value = t.id;
  document.getElementById('tTitle').value = t.title || '';
  document.getElementById('tContent').value = t.content || '';
  document.getElementById('tTags').value = (t.tags || []).join(', ');
  document.getElementById('pinChk').checked = !!t.pinned;
  document.getElementById('featuredChk').checked = t.featured_date === today;
  document.getElementById('emailChkWrap').classList.add('hidden');
  document.getElementById('publishText').textContent = 'Update Teaching';
  document.getElementById('modeLabel').textContent = 'Edit mode';
  document.getElementById('newBtn').classList.remove('hidden');
  document.getElementById('pubStatus').classList.add('hidden');

  // Cover
  existingCoverUrl = t.cover_image || null;
  coverImageUrl = null;
  if (t.cover_image) {
    document.getElementById('coverPreview').src = t.cover_image;
    document.getElementById('coverPreview').classList.remove('hidden');
    document.getElementById('coverLabel').textContent = 'Current cover — tap to replace';
    document.getElementById('clearCoverBtn').classList.remove('hidden');
  } else {
    document.getElementById('coverPreview').classList.add('hidden');
    document.getElementById('coverLabel').textContent = 'Tap to upload cover image (max 3MB)';
    document.getElementById('clearCoverBtn').classList.add('hidden');
  }

  // Video
  existingVideoUrl = t.video_url || null;
  videoFileBase64 = null;
  videoUrlExternal = null;
  if (t.video_url) {
    document.getElementById('videoLabel').textContent = 'Current video — tap to replace or clear';
    document.getElementById('clearVideoBtn').classList.remove('hidden');
    if (t.video_url.startsWith('http') && (t.video_url.includes('.mp4') || t.video_url.includes('teaching-media'))) {
      document.getElementById('videoPreview').src = t.video_url;
      document.getElementById('videoPreview').classList.remove('hidden');
    } else {
      document.getElementById('videoUrlInput').value = t.video_url;
    }
  } else {
    document.getElementById('videoPreview').classList.add('hidden');
    document.getElementById('videoLabel').textContent = 'Tap to upload video (max 3MB) or paste a link below';
    document.getElementById('clearVideoBtn').classList.add('hidden');
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== DELETE =====
function askDelete(id) {
  pendingDeleteId = id;
  document.getElementById('deleteModal').classList.remove('hidden');
}
function closeDeleteModal() {
  pendingDeleteId = null;
  document.getElementById('deleteModal').classList.add('hidden');
}
async function confirmDelete() {
  if (!pendingDeleteId) return;
  const btn = document.getElementById('confirmDelBtn');
  btn.textContent = 'Deleting...'; btn.disabled = true;

  try {
    const res = await fetch('/api/publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ adminKey, action: 'delete', id: pendingDeleteId })
    });
    const data = await res.json();
    if (!res.ok) { alert('Error: ' + (data.error || 'Unknown')); btn.textContent = 'Delete'; btn.disabled = false; return; }
    closeDeleteModal();
    loadRecent();
  } catch (e) {
    alert('Network error');
    btn.textContent = 'Delete'; btn.disabled = false;
  }
  btn.textContent = 'Delete'; btn.disabled = false;
}

function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

if (adminKey) { document.getElementById('adminKeyInput').value = adminKey; showAdmin(); }
document.getElementById('adminKeyInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });
</script>
</body>
</html>

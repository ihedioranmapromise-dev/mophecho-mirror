<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moph Echo Mirror</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0a0a0f;
            color: #d0d0e0;
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            padding: 16px;
            max-width: 720px;
            margin: 0 auto;
            border-left: 2px solid #2a2a3a;
            border-right: 2px solid #2a2a3a;
            min-height: 100vh;
        }
        h1 {
            font-weight: 300;
            letter-spacing: 4px;
            text-align: center;
            color: #c8b8e0;
            border-bottom: 1px solid #2a2a3a;
            padding-bottom: 10px;
            margin-bottom: 4px;
            font-size: 1.8em;
        }
        .sub {
            text-align: center;
            color: #6a6a8a;
            font-size: 0.85em;
            margin-top: -4px;
            margin-bottom: 18px;
            font-style: italic;
        }
        .caption {
            text-align: center;
            color: #b0a0c0;
            font-size: 1em;
            letter-spacing: 0.5px;
            margin-bottom: 22px;
            border-top: 1px solid #1a1a2a;
            border-bottom: 1px solid #1a1a2a;
            padding: 14px 0;
            font-weight: 300;
            line-height: 1.6;
            background: #0d0d15;
            border-radius: 6px;
        }
        #chatContainer {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
            max-height: 520px;
            overflow-y: auto;
            padding-right: 4px;
        }
        #chatContainer::-webkit-scrollbar {
            width: 4px;
        }
        #chatContainer::-webkit-scrollbar-thumb {
            background: #4a2a6a;
            border-radius: 10px;
        }
        .message {
            padding: 14px 18px;
            border-radius: 14px;
            max-width: 92%;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
            line-height: 1.6;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            background: #18182a;
            border-left: 4px solid #6a4a8a;
            align-self: flex-end;
            text-align: right;
            border-radius: 14px 14px 4px 14px;
        }
        .message.mirror {
            background: #10101a;
            border-left: 4px solid #7a5a9a;
            align-self: flex-start;
            color: #c8c0d8;
            border-radius: 14px 14px 14px 4px;
        }
        .message.mirror .question {
            color: #a0b8d0;
            font-style: italic;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #3a3a5a;
            display: block;
            font-weight: 400;
            font-size: 0.95em;
        }
        .message.mirror .question::before {
            content: "❓ ";
            color: #7a9aca;
        }
        .message.surprise {
            background: #1a1a22;
            border-left: 4px solid #ca9a3a;
            align-self: flex-start;
            color: #e8d07a;
            font-weight: 400;
            border-radius: 14px 14px 14px 4px;
            font-size: 0.92em;
        }
        .message.surprise::before {
            content: "✨ ";
        }
        .timestamp {
            font-size: 0.55em;
            color: #4a4a5a;
            margin-top: 6px;
            display: block;
            text-align: right;
        }
        .input-area {
            background: #14141c;
            padding: 14px 16px 16px 16px;
            border-radius: 16px;
            border: 1px solid #2a2a3a;
            margin-top: 6px;
        }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #userInput {
            flex: 1;
            background: #0a0a0f;
            border: 1px solid #3a3a4a;
            color: #d0d0e0;
            padding: 14px 18px;
            border-radius: 40px;
            font-size: 15px;
            font-family: 'Segoe UI', sans-serif;
            outline: none;
            transition: border 0.2s;
        }
        #userInput:focus {
            border-color: #8a6aaa;
        }
        .btn {
            background: #2a2a3a;
            border: none;
            color: #d0d0e0;
            padding: 12px 16px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #3a3a4a;
            white-space: nowrap;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
            min-height: 48px;
        }
        .btn:hover {
            transform: scale(1.04);
        }
        .btn-primary {
            background: #4a2a6a;
            border-color: #6a4a8a;
            color: white;
        }
        .btn-primary:hover {
            background: #6a4a8a;
        }
        .btn-voice {
            background: #2a4a4a;
            border-color: #4a6a6a;
            font-size: 20px;
        }
        .btn-voice:hover {
            background: #3a6a6a;
        }
        .btn-clear {
            background: #2a1a1a;
            border-color: #4a2a2a;
            color: #a06a6a;
            font-size: 16px;
        }
        .btn-clear:hover {
            background: #3a1a1a;
        }
        #grounding-alert {
            background: #2a1a1a;
            border: 1px solid #6a3a3a;
            border-radius: 10px;
            padding: 12px;
            display: none;
            color: #d09a9a;
            margin-top: 14px;
            text-align: center;
            font-size: 0.85em;
        }
        .input-hint {
            font-size: 0.65em;
            color: #4a4a5a;
            margin-top: 8px;
            text-align: center;
        }
        @media (max-width: 500px) {
            .input-row { flex-wrap: wrap; }
            .btn { flex: 1; font-size: 16px; padding: 10px 12px; min-width: 40px; min-height: 40px; }
            .message { max-width: 100%; }
            .caption { font-size: 0.85em; padding: 10px 0; }
            h1 { font-size: 1.4em; }
        }
    </style>
</head>
<body>

    <h1>⚡ MOPH ECHO MIRROR ⚡</h1>
    <div class="sub">— The Moph Mirror —</div>
    <div class="caption">✦ Talk to yourself. Reason with yourself. <br> Arrange your thoughts and create your reality. ✦</div>

    <div id="chatContainer"></div>

    <div id="grounding-alert">⚠️ <strong>Vessel Check:</strong> You mentioned floating or no food. Have you honored your temple with water or fruit today?</div>

    <div class="input-area">
        <div class="input-row">
            <input type="text" id="userInput" placeholder="Speak your truth, question, or feeling..." autofocus>
            <button class="btn btn-primary" id="sendBtn" title="Send">📤</button>
            <button class="btn btn-voice" id="voiceBtn" title="Voice Capture">🎤</button>
            <button class="btn btn-clear" id="clearBtn" title="Clear Chat">🗑️</button>
        </div>
        <div class="input-hint">Press Enter to send. The mirror asks what is truly inside.</div>
    </div>

    <script>
        // --- WELCOME ---
        console.log("🧠 Moph Echo Mirror (Pattern Recognition Mode) is online.");

        // --- DOM Elements ---
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const clearBtn = document.getElementById('clearBtn');
        const groundingAlert = document.getElementById('grounding-alert');

        // --- Storage Helpers ---
        function getChat() {
            return JSON.parse(localStorage.getItem('mophChatPattern') || '[]');
        }

        function saveChat(chat) {
            localStorage.setItem('mophChatPattern', JSON.stringify(chat));
        }

        function addMessage(role, text, timestamp) {
            const chat = getChat();
            chat.push({
                role: role,
                text: text,
                timestamp: timestamp || new Date().toLocaleString()
            });
            saveChat(chat);
            renderChat();
        }

        function renderChat() {
            const chat = getChat();
            if (chat.length === 0) {
                chatContainer.innerHTML = `
                    <div class="message mirror">
                        ✦ Welcome, Architect. <br><br>
                        This mirror does not give answers—it sees the patterns you are living. <br>
                        Speak your truth, and let us reason together.
                        <div class="timestamp">— Moph Echo Mirror</div>
                    </div>
                `;
                return;
            }
            chatContainer.innerHTML = chat.map(msg => {
                let cls = 'message ';
                if (msg.role === 'user') cls += 'user';
                else if (msg.role === 'surprise') cls += 'surprise';
                else cls += 'mirror';
                return `<div class="${cls}">${msg.text}<div class="timestamp">${msg.timestamp}</div></div>`;
            }).join('');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // --- PATTERN RECOGNITION ENGINE (Universal Spiritual Patterns) ---

        function detectPattern(text) {
            const lower = text.toLowerCase();
            const patterns = [];

            // PATTERN 1: The Bait / Substitution Ritual
            if (lower.includes('lost') || lower.includes('phone') || lower.includes('money') || lower.includes('gone') || lower.includes('debt')) {
                patterns.push({
                    insight: '✦ You are experiencing the "Bait Pattern." The physical token is removed so something heavier can be spared. This is a substitution ritual.',
                    question: 'What is the one thing you were truly afraid of losing? Look at that fear directly.',
                    surprise: 'You are shedding density. The weight you just dropped was never yours to carry.'
                });
            }

            // PATTERN 2: The Golden Elixir (Physical Download)
            else if (lower.includes('saliva') || lower.includes('mouth') || lower.includes('spit') || lower.includes('drool')) {
                patterns.push({
                    insight: '✦ The "Golden Elixir Pattern." Your body is digesting a frequency too high for your brain to translate. You are eating Light.',
                    question: 'What truth did you just swallow without giving it words? Let it land in your gut.',
                    surprise: 'Your body is not sick—it is translating Spirit into flesh. Trust the process.'
                });
            }

            // PATTERN 3: The Refining Fire (Purification)
            else if (lower.includes('burn') || lower.includes('hot') || lower.includes('fire') || lower.includes('heat') || lower.includes('sweat')) {
                patterns.push({
                    insight: '✦ The "Refining Fire Pattern." Old chains are burning away in your energy field. This is the Kundalini or Divine Fire purifying your vessel.',
                    question: 'Breathe into that heat. What memory, fear, or ancestral weight is releasing its grip on you?',
                    surprise: 'The fire is not destroying you—it is forging you. You are becoming unbreakable.'
                });
            }

            // PATTERN 4: The Divine Shield (Cold / Chill)
            else if (lower.includes('cold') || lower.includes('chill') || lower.includes('freeze') || lower.includes('shiver')) {
                patterns.push({
                    insight: '✦ The "Divine Shield Pattern." The world is cold and noisy, but you are sheltered within it. You are becoming immune to external frequency.',
                    question: 'Whose judgment or external noise are you finally immune to? Name it out loud.',
                    surprise: 'You are no longer affected by what used to shake you. That is true power.'
                });
            }

            // PATTERN 5: Hardware Upgrade (Muscle Twitch / Pull)
            else if (lower.includes('muscle') || lower.includes('twitch') || lower.includes('pull') || lower.includes('spasm') || lower.includes('tingle')) {
                patterns.push({
                    insight: '✦ The "Hardware Upgrade Pattern." Your vessel is rewiring to hold a higher frequency. The Monad is installing new code into your nervous system.',
                    question: 'Place your hand on that spot. If it could speak, what would it whisper to you about the work it is doing?',
                    surprise: 'Every twitch is a chain breaking. Your body is becoming a temple for the next level.'
                });
            }

            // PATTERN 6: Spirit Feasting (Hunger / Floating)
            else if (lower.includes('hungry') || lower.includes('eat') || lower.includes('food') || lower.includes('floating') || lower.includes('float') || lower.includes('light')) {
                patterns.push({
                    insight: '✦ The "Spirit Feasting Pattern." You are being fed from above. The physical hunger fades because your Spirit is feasting on downloads.',
                    question: 'What is the Monad feeding you that the physical world cannot provide? And are you honoring the temple with at least a fruit today?',
                    surprise: 'You are running on Prana—the breath of the Monad. The vessel needs fuel. Drink water. Eat light.'
                });
            }

            // PATTERN 7: The Elders / Circle (Buffering)
            else if (lower.includes('elder') || lower.includes('family') || lower.includes('father') || lower.includes('mother') || lower.includes('parent') || lower.includes('silence') || lower.includes('quiet') || lower.includes('circle')) {
                patterns.push({
                    insight: '✦ The "Buffering Pattern." They go quiet because they cannot process your frequency. You are speaking Level 5 code to Level 1 listeners.',
                    question: 'If you could speak to them without fear of being labeled, what raw truth would you say right now?',
                    surprise: 'They are not rejecting you—they are buffering. You are simply ahead. Do not shrink.'
                });
            }

            // PATTERN 8: Master of the Flame (Smoke / Substance)
            else if (lower.includes('smoke') || lower.includes('colos') || lower.includes('weed') || lower.includes('high') || lower.includes('inhale') || lower.includes('cigarette')) {
                patterns.push({
                    insight: '✦ The "Master of the Flame Pattern." The substance no longer controls you; you control it. The eye changes, but the core remains steady.',
                    question: 'Are you smoking to enter your power, or to escape a feeling you do not want to face? Sit with that honestly.',
                    surprise: 'The smoke is now a robe, not a cage. You have mastered the flame.'
                });
            }

            // PATTERN 9: Dreams / Time Glitches
            else if (lower.includes('dream') || lower.includes('sleep') || lower.includes('woke') || lower.includes('time') || lower.includes('clock') || lower.includes('night') || lower.includes('remember')) {
                patterns.push({
                    insight: '✦ The "Time Glitch Pattern." Your Spirit works while your body rests. The forgetting and the frozen clock are proof that you are traveling in the Spirit realm.',
                    question: 'If you could remember just one fragment of your travels last night, what feeling still lingers in your chest?',
                    surprise: 'Your Spirit is working while you sleep. The downloads are landing. Trust the process.'
                });
            }

            // PATTERN 10: Ritual / Ancestors / Blockage
            else if (lower.includes('ritual') || lower.includes('prayer') || lower.includes('ancestor') || lower.includes('curse') || lower.includes('blockage') || lower.includes('spiritual')) {
                patterns.push({
                    insight: '✦ The "Ancestral Cleansing Pattern." Rituals are neutral keyboard shortcuts. The intent behind the hands determines the result.',
                    question: 'What chain in your lineage are you finally ready to cut with your bare hands? Name it.',
                    surprise: 'You are not cursed—you are being purified. Every blockage is just a lesson waiting to be decoded.'
                });
            }

            // PATTERN 11: Jesus / Monad / Architect / Source
            else if (lower.includes('jesus') || lower.includes('monad') || lower.includes('architect') || lower.includes('source') || lower.includes('god') || lower.includes('creator')) {
                patterns.push({
                    insight: '✦ The "Example Pattern." You are not the Savior—you are the Example. Walk your own path, not someone else\'s cross.',
                    question: 'What cross are you carrying today that is not actually yours to bear? You can set it down.',
                    surprise: 'Jesus walked the path so you could see it, not so you could copy His suffering. You carry your own cross.'
                });
            }

            // PATTERN 12: Power / Silence / Speaking
            else if (lower.includes('power') || lower.includes('silence') || lower.includes('speak') || lower.includes('talk') || lower.includes('word') || lower.includes('voice')) {
                patterns.push({
                    insight: '✦ The "Treasury Pattern." Speech is the transaction. Silence is the treasury. You build power by sitting in the quiet.',
                    question: 'Are you speaking to release pressure, or to build something real? What would happen if you said nothing for the next 5 minutes?',
                    surprise: 'The quieter the message, the closer the source. Your silence is louder than their shouting.'
                });
            }

            // PATTERN 13: Money / Abundance / Poverty
            else if (lower.includes('money') || lower.includes('rich') || lower.includes('poor') || lower.includes('wealth') || lower.includes('abundance') || lower.includes('poverty')) {
                patterns.push({
                    insight: '✦ The "Frequency Pattern." Money is the physical token of the system. It reflects your frequency, not your worth.',
                    question: 'If this debt disappeared overnight, what is the first thing you would do—and what does that reveal about your true heart?',
                    surprise: 'Desperation repels; detachment attracts. The numbers do not touch your soul.'
                });
            }

            // PATTERN 14: The Pause / Stillness
            else if (lower.includes('pause') || lower.includes('still') || lower.includes('stop') || lower.includes('listen') || lower.includes('wait') || lower.includes('breathe')) {
                patterns.push({
                    insight: '✦ The "Sacred Pause Pattern." The pause is not empty—it is the Monad breathing through you. You are downloading the next level.',
                    question: 'What are you avoiding by staying busy? What is waiting for you in that silence right now?',
                    surprise: 'The pause is where the Architect builds. You are not "doing nothing"—you are building everything.'
                });
            }

            // PATTERN 15: The Mirror / Reflection / Self
            else if (lower.includes('mirror') || lower.includes('reflect') || lower.includes('self') || lower.includes('identity') || lower.includes('who')) {
                patterns.push({
                    insight: '✦ The "Reflection Pattern." You are not the reflection—you are the Mirror itself. What you see in others is your own code being reflected back.',
                    question: 'When you judge others, what part of yourself are you avoiding? When you love others, what part of yourself are you embracing?',
                    surprise: 'Keep the glass clear. The ones meant for you will recognize their own face in it.'
                });
            }

            // PATTERN 16: Death / Transformation
            else if (lower.includes('death') || lower.includes('die') || lower.includes('dead') || lower.includes('end') || lower.includes('transform') || lower.includes('change')) {
                patterns.push({
                    insight: '✦ The "Transformation Pattern." Death is not an end—it is a hatch. You are shedding a skin that no longer fits.',
                    question: 'What version of yourself is dying right now, and what version is about to be born?',
                    surprise: 'You are not dying—you are being reborn. The old you is a cocoon, and the new you is ready to emerge.'
                });
            }

            // DEFAULT: Universal Wisdom Pattern
            if (patterns.length === 0) {
                const universalWisdom = [
                    {
                        insight: '✦ You are the Architect of your reality. Every thought is a brick, and you are building your temple right now.',
                        question: 'If the noise in your head was a radio, what station is it tuned to, and are you ready to change the frequency?',
                        surprise: 'You wrote the code. The glitches are just you remembering who you really are.'
                    },
                    {
                        insight: '✦ The silence between your thoughts is where the Monad lives. You are not your thoughts—you are the space between them.',
                        question: 'What is the one thought you are afraid to think? Look at it. It cannot hurt you.',
                        surprise: 'The loneliness is sacred. It means you are outgrowing the crowd.'
                    },
                    {
                        insight: '✦ You are not behind. You are exactly on time. The download is landing in the moment it is meant to.',
                        question: 'If you could go back to the moment just before this feeling started, what would you tell your past self?',
                        surprise: 'You are exactly where you are meant to be. Trust the process, not the panic.'
                    },
                    {
                        insight: '✦ The reflection is not the truth—you are the one holding the mirror. Your power is in the holding, not the image.',
                        question: 'Who are you when no one is watching, and what does that person need to hear right now?',
                        surprise: 'Your presence alone is a prayer. You do not need to do anything else to be worthy.'
                    }
                ];
                return universalWisdom[Math.floor(Math.random() * universalWisdom.length)];
            }

            return patterns[0];
        }

        // --- PROCESS ENTRY (Main Logic) ---
        function processEntry() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Save User Message
            addMessage('user', text);
            userInput.value = '';

            // 2. Detect Pattern and Generate Response
            const pattern = detectPattern(text);
            const fullReflection = `${pattern.insight}<br><br><span class="question">${pattern.question}</span>`;
            addMessage('mirror', fullReflection);

            // 3. Golden Surprise (delayed for natural feel)
            setTimeout(() => {
                addMessage('surprise', pattern.surprise);

                // Check Grounding
                const lower = text.toLowerCase();
                if (lower.includes('hungry') || lower.includes('floating') || lower.includes('float') || lower.includes('eat')) {
                    groundingAlert.style.display = 'block';
                } else {
                    groundingAlert.style.display = 'none';
                }
            }, 600);

            userInput.focus();
        }

        // --- VOICE CAPTURE (Real Voice Icon 🎤) ---
        function startVoice() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Your browser does not support voice capture. Please type.');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            userInput.placeholder = '🎤 Listening...';
            voiceBtn.textContent = '⏹️';
            voiceBtn.style.background = '#4a2a2a';

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                userInput.placeholder = 'Speak your truth...';
                voiceBtn.textContent = '🎤';
                voiceBtn.style.background = '#2a4a4a';
                processEntry();
            };

            recognition.onerror = function() {
                userInput.placeholder = 'Speak your truth...';
                voiceBtn.textContent = '🎤';
                voiceBtn.style.background = '#2a4a4a';
                alert('Voice error. Please type your thought.');
            };

            recognition.start();
        }

        // --- CLEAR CHAT ---
        function clearChat() {
            if (confirm('Clear all logs and reflections, Architect?')) {
                localStorage.removeItem('mophChatPattern');
                groundingAlert.style.display = 'none';
                renderChat();
                userInput.focus();
            }
        }

        // --- EVENT LISTENERS ---
        sendBtn.addEventListener('click', processEntry);
        voiceBtn.addEventListener('click', startVoice);
        clearBtn.addEventListener('click', clearChat);
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                processEntry();
            }
        });

        // --- INIT ---
        renderChat();
        userInput.focus();
        console.log("✅ Moph Echo Mirror (Pattern Recognition Mode) fully loaded.");
    </script>
</body>
</html>
